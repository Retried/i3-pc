# inFAMOUS Second Son - keyboard/mouse and controller bindings.
# Format: <PS4 pad output> = <key or controller input>. F8 reloads this file in-game.

# --- Keyboard and mouse ---
# Mouse moves the camera (right stick). F7 toggles mouse capture.
mouse_to_joystick = right
# deadzone offset, speed, speed offset
mouse_movement_params = 0.5, 1, 0.125

axis_left_x_minus = a
axis_left_x_plus = d
axis_left_y_minus = w
axis_left_y_plus = s

# Pad actions as the in-game Options screen names them:
# R2 MAIN ATTACK, R1 HEAVY ATTACK, L2 AIM, L1 SPECIAL POWER, cross JUMP, circle DASH,
# square MELEE, triangle KARMIC ACTIONS, left stick MOVE, right stick TURN.
r2 = leftbutton
l2 = rightbutton
r1 = middlebutton
r1 = q
l1 = e
cross = space
cross = enter
circle = lshift
circle = lctrl
circle = backspace
square = f
triangle = r
l3 = v
r3 = z
touchpad_center = t
touchpad_center = tab

pad_up = up
pad_down = down
pad_left = left
pad_right = right
pad_up = 1
pad_down = 2
pad_left = 3
pad_right = 4

options = escape

# Motion gestures (the game asks for them, e.g. spray cans): hold G = pad held sideways,
# hold H = shake.
motion_sideways = g
motion_shake = h

# Touchpad swipes (doors, grates, interactions): I up, K down, J left, L right.
touchpad_swipe_up = i
touchpad_swipe_down = k
touchpad_swipe_left = j
touchpad_swipe_right = l
# "Press and hold the Touch Pad Button with both thumbs" (e.g. Move Car): hold U.
touchpad_two_fingers = u

# --- Controller (Xbox, DualShock, DualSense, Switch Pro via SDL) ---
triangle = triangle
cross = cross
square = square
circle = circle
l1 = l1
l2 = l2
l3 = l3
r1 = r1
r2 = r2
r3 = r3
options = options
touchpad_center = back
pad_up = pad_up
pad_down = pad_down
pad_left = pad_left
pad_right = pad_right
axis_left_x = axis_left_x
axis_left_y = axis_left_y
axis_right_x = axis_right_x
axis_right_y = axis_right_y

# Pads without sensors: hold LB+RB sideways; while holding them, View+X shakes.
# Aim with the right stick and spray with RT. Single buttons retain normal actions.
motion_sideways = l1, r1
motion_shake = back, square
# View plus D-pad emulates touch swipes; L3+R3 holds both touch contacts.
touchpad_swipe_up = back, pad_up
touchpad_swipe_down = back, pad_down
touchpad_swipe_left = back, pad_left
touchpad_swipe_right = back, pad_right
touchpad_two_fingers = l3, r3

analog_deadzone = leftjoystick, 5, 127
analog_deadzone = rightjoystick, 5, 127
